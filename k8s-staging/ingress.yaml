apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: landing-ingress
  namespace: shieldhedge-staging
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - staging.solhedge.xyz
      secretName: landing-staging-tls
  rules:
    - host: staging.solhedge.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: landing-svc
                port:
                  name: http
